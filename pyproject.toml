[build-system]
requires = ["scikit-build-core>=0.8", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "opensot_model_interface"
version = "5.0.0"
description = "xbot2_interface python"
requires-python = ">=3.10"
dependencies = [
    "numpy<=1.26.4",
]
license = "Apache-2.0 AND MIT AND BSD-3-Clause"
license-files = [
  "LICENSE",
  "external/fmt-10.2.1/LICENSE*",
  "src/collision/LICENSE-extractMeshData.txt",
  "THIRD_PARTY_NOTICES.md",
]

[project.urls]
Homepage = "https://github.com/hucebot/xbot2_interface"

[tool.scikit-build]
cmake.version = ">=3.20"
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
wheel.packages = []
cmake.define = { XBOT2_IFC_BUILD_TESTS = "OFF" , XBOT2_IFC_BUILD_EXAMPLES = "OFF"}

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_*"
manylinux-x86_64-image = "ghcr.io/hucebot/opensot/opensot-manylinux:latest"


